<app-section-wrapper>
    <section class="py-8 space-y-12">
        <a routerLink="/profil" class="inline-flex items-center gap-2 text-sm text-primary hover:underline">
            <lucide-icon [img]="ArrowLeft" size="18" />
            Retour au profil
        </a>

        <h2 class="text-2xl mb-6">Modifier mon profil</h2>
        <div role="tablist" class="tabs tabs-border">
            <a
                role="tab"
                class="tab flex gap-4 items-center"
                [class.tab-active]="selectedTab() === 'general'"
                (click)="selectedTab.set('general')"
            >
                <lucide-icon [img]="User" size="16" />
                Général
            </a>

            <a
                role="tab"
                class="tab flex gap-4 items-center"
                [class.tab-active]="selectedTab() === 'security'"
                (click)="selectedTab.set('security')"
            >
                <lucide-icon [img]="Shield" size="16" />
                Sécurité
            </a>

            <a
                role="tab"
                class="tab flex gap-4 items-center"
                [class.tab-active]="selectedTab() === 'notifications'"
                (click)="selectedTab.set('notifications')"
            >
                <lucide-icon [img]="Bell" size="16" />
                Notifications
            </a>

            <a
                role="tab"
                class="tab flex gap-4 items-center"
                [class.tab-active]="selectedTab() === 'account'"
                (click)="selectedTab.set('account')"
            >
                <lucide-icon [img]="Settings" size="16" />
                Compte
            </a>
        </div>
        @if (selectedTab() === "general") {
        <app-general />
        } @else if (selectedTab() === "security") {
        <app-security />
        } @else if (selectedTab() === "notifications") {
        <app-notifications />
        } @else if (selectedTab() === "account") {
        <app-compte />
        }
    </section>
</app-section-wrapper>
