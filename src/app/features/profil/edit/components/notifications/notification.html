<div class="card bg-base-100 border border-base-200 p-6 rounded-lg">
    <h3 class="text-lg font-semibold mb-1">Préférences de notification</h3>
    <p class="text-sm text-base-content/60 mb-6">Choisissez comment vous souhaitez être notifié</p>

    <div class="divide-y divide-base-200">
        <label class="flex items-center justify-between py-4 cursor-pointer">
            <div>
                <p class="font-medium">Newsletter</p>
                <p class="text-sm text-base-content/60">Recevez nos dernières actualités et offres spéciales</p>
            </div>
            <input type="checkbox" class="checkbox checkbox-primary" checked />
        </label>

        <label class="flex items-center justify-between py-4 cursor-pointer">
            <div>
                <p class="font-medium">Notifications push</p>
                <p class="text-sm text-base-content/60">Notifications pour les commandes et messages</p>
            </div>
            <input type="checkbox" class="checkbox checkbox-primary" checked />
        </label>

        <label class="flex items-center justify-between py-4 cursor-pointer">
            <div>
                <p class="font-medium">Notifications par email</p>
                <p class="text-sm text-base-content/60">Mises à jour importantes par email</p>
            </div>
            <input type="checkbox" class="checkbox checkbox-primary" checked />
        </label>

        <label class="flex items-center justify-between py-4 cursor-pointer">
            <div>
                <p class="font-medium">Rappels de panier abandonné</p>
                <p class="text-sm text-base-content/60">Rappels pour finaliser vos achats</p>
            </div>
            <input type="checkbox" class="checkbox checkbox-primary" checked />
        </label>
    </div>

    <div class="mt-6">
        <button class="btn bg-primary text-base-100 hover:bg-primary/90">Enregistrer les préférences</button>
    </div>
</div>
