<app-section-wrapper>
    <section class="py-8 md:py-16 mt-32" aria-label="Carrousel de produits">
        <app-section-intro
            title="Encore plus d’inspirations"
            description="Poursuivez votre voyage créatif avec ces catégories"
        />

        @if (featuredProducts()) {
            @if (featuredProducts().length > 0) {
                <app-slider [data]="featuredProducts()" [template]="productTemplate"/>
            }
        }
    </section>
    <ng-template #productTemplate let-product>
        <div class="card bg-base-100 shadow-sm rounded-lg overflow-hidden">
            <a [routerLink]="['/boutique', product.slug]">
                <span class="sr-only">Produit {{ product.name }}</span>

                <app-responsive-image [image]="product.images" [alt]="product.name" class="h-80"/>

                <div class="card-body p-6">
                    <span class="text-sm text-neutral uppercase tracking-widest"> {{ product.categorie.name }} </span>
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg truncate">{{ product.name }}</h3>
                        <lucide-icon
                            [img]="Heart"
                            (click)="onClickHeart($event, product)"
                            class="w-6 h-6 cursor-pointer transition duration-300 ease-in-out relative z-10"
                            [class]="product.favori?.liked ? 'heart-active': ''"
                            [@pulseHeart]="pulseState[product.id]"
                        />
                    </div>
                    <span class="text-base text-base-content">{{ product.price }}€</span>
                    <div class="card-actions mt-4">
                        @if (!isInCart(product.id)) {
                            <app-button (click)="addToCart($event,product)" class="w-full">Ajouter au panier
                            </app-button>
                        } @else {
                            <p class="text-sm text-success text-center w-full">Déjà dans le panier</p>
                        }
                    </div>
                </div>
            </a>
        </div>
    </ng-template>
</app-section-wrapper>
