<div>
	<label for="{{ id() }}" class="label">
		{{ label() }}
		@if (required()) {
			<span class="text-error">*</span>
		}
	</label>
</div>
<div class="relative">
	<input
		[type]="show() ? 'text' : 'password'"
		class="input input-bordered w-full pr-10"
		[class.input-error]="control().invalid && (control().dirty || control().touched)"
		placeholder="{{ placeholder() }}"
		formControlName="{{ controlName() }}"
		[attr.aria-describedby]="id() + '-error'"
	/>

	<!-- Eye icon inside the input -->
	<button type="button" class="absolute inset-y-0 right-2 flex items-center" (click)="toggle()">
		<lucide-icon [img]="show() ? EyeOff : Eye" class="w-5 h-5 text-base-content/70" />
	</button>
</div>

@if (control().invalid && (control().dirty || control().touched)) {
	<span id="{{ id() }}-error" class="text-error text-sm mt-1 block animate-fade-in">
		{{ errorMessage() }}
	</span>
}
