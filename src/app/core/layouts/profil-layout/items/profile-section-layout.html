<div class="container mt-48 md:mt-[230px] mb-16 flex flex-col gap-6">
    <div class="flex justify-between items-center">
        <a routerLink="/profil" class="btn btn-link text-base-content gap-2 pl-0">
            <lucide-icon [img]="ArrowLeft" size="18" />
            Retour au profil
        </a>
    </div>

    <div class="flex flex-col gap-4">
        <div class="flex justify-between">
            <h1 class="text-2xl font-semibold text-base-content">{{ title() }}</h1>
            <div class="flex gap-4">
                @if (showShareButton()) {
                <div class="flex items-center gap-2">
                    <app-button size="sm" variant="outline" [icon]="Share">Partager</app-button>
                </div>
                } @if (showShareListCreate()) {
                <app-button variant="secondary" [icon]="Heart" (click)="openWishlistModal()"
                    >Créer une nouvelle liste
                </app-button>
                }
            </div>
        </div>

        <div class="w-full">
            <input
                type="text"
                placeholder="Rechercher..."
                class="input input-bordered w-full"
                [value]="search()"
                (input)="onSearchChange($event)"
            />
        </div>
    </div>

    <ng-content select="[sectionContent]" />

    <!--	<app-pagination />-->
</div>
